laser:
  E0: 1 W/cm^2
  D: 102 um
  R: $( ${D}/2)
  wavelength: 530 nm
layers:
  - name: Henle's fiber layer
    z0: 0 um
    d: 7 um
    mua:  6.41266259484748 / centimeter
  - name: Pigmented RPE
    z0: 67 um
    d: 10 um
    mua: 1391.5604505171739 / centimeter
  - name: Choiroid
    z0: 81 um
    d: 170 um
    mua: 221.71041240618916 / centimeter
simulation:
  sensor:
    z: 70 um
    r: 0 um
  time:
    dt: 100 us
    tmax: $( ${/multi_pulse/N}*${/multi_pulse/t0} + 5*${/multi_pulse/tau})
thermal:
  k: 0.006306 W/cm/K
  rho: 1 g / cm^3
  c: 4.178 J /g/ K
multi_pulse:
  tau : 10 ms
  prf: 50 Hz
  t0 : $( 1/${prf})
  N : 25 # 512


reedbed:
  kind: MultiplePulse
  thermal:
    k: $(${/thermal/k}.to("W / cm / K").magnitude)
    c: $(${/thermal/c}.to("J / g / K").magnitude)
    rho: $(${/thermal/rho}.to("g/cm^3").magnitude)
  layers:
    - e0: $(${/laser/E0}.to("W/cm^2").magnitude)
      mu_a: $(${/layers/0/mua}.to("1/cm").magnitude)
      d: $(${/layers/0/d}.to("cm").magnitude)
      z0: $(${/layers/0/z0}.to("cm").magnitude)
    - e0: $(${/laser/E0}.to("W/cm^2").magnitude)
      mu_a: $(${/layers/1/mua}.to("1/cm").magnitude)
      d: $(${/layers/1/d}.to("cm").magnitude)
      z0: $(${/layers/1/z0}.to("cm").magnitude)
  simulation:
    sensor:
      z: $(${/simulation/sensor/z}.to("cm").magnitude)
      r: $(${/simulation/sensor/r}.to("cm").magnitude)
    time:
      kind: Uniform
      t0: 0
      dt: $(${/simulation/time/dt}.to("s").magnitude)
      tmax: $(${/simulation/time/tmax}.to("s").magnitude)
  laser:
    kind: FlatTopBeam
    radius: $(${/laser/R}.to("cm").magnitude)
  pulses: "$( [ {'arrival_time' : n*${/multi_pulse/t0}.to('s').magnitude, 'duration':${/multi_pulse/tau}.to('s').magnitude, 'scale':1}  for n in range(${/multi_pulse/N})] )"


retina-therm:
  thermal:
    k: $( str(${/thermal/k}) )
    rho: $( str(${/thermal/rho}) )
    c: $( str(${/thermal/c}) )
  layers:
    - name: $(${/layers/0/name})
      z0: $(str(${/layers/0/z0}))
      d: $(str(${/layers/0/d}))
      mua: $(str(${/layers/0/mua}))
    - name: $(${/layers/1/name})
      z0: $(str(${/layers/1/z0}))
      d: $(str(${/layers/1/d}))
      mua: $(str(${/layers/1/mua}))
    - name: $(${/layers/2/name})
      z0: $(str(${/layers/2/z0}))
      d: $(str(${/layers/2/d}))
      mua: $(str(${/layers/2/mua}))
  laser:
    E0: $(str(${/laser/E0}))
    one_over_e_radius: $(str(${/laser/R}))
    wavelength: $(str(${/laser/wavelength}))

  temperature_rise:
    use_approximation: True
    temperature_rise:
      method: quad
    sensor:
      z: $(str(${/simulation/sensor/z}))
      r: $(str(${/simulation/sensor/r}))
    time:
      resolution: $(str(${/simulation/time/dt}))
      max: $(str(${/simulation/time/tmax}))
    output_file: output/retina-therm/Tvst-CW.txt
    output_config_file: output/retina-therm/CONFIG-CW.yml

  multiple_pulse:
    input_file: ./output/retina-therm/Tvst-CW.txt
    output_file: 'output/retina-therm/Tvst-MP.txt'
    output_config_file: output/retina-therm/CONFIG-MP.yml
    pulses: "$( [ {'arrival_time' : str(n*${/multi_pulse/t0}), 'duration':str(${/multi_pulse/tau}.to('s')), 'scale':1}  for n in range(${/multi_pulse/N})] )"

